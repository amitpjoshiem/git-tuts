name: List Modified Files

on:
  pull_request: # Trigger on pull requests
    types: [opened, synchronize, reopened] # Only trigger on specific PR events
  push: # Also trigger on push events
    branches:
      - main # Adjust to your main branch name if different

jobs:
  list_changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2 # Check out the repository code

      - name: Get modified files
        id: file_changes
        uses: trilom/file-changes-action@v1.2.3
        with:
          githubRepo: ${{ github.repository }} # Use the current repo
          githubToken: ${{ secrets.BOT_TOKEN }} # Use a GitHub token for authentication
          output: 'json' # Output format can be adjusted as needed
          fileOutput: 'csv' # Output modified files in CSV format

      - name: Display modified files
        run: |
          echo "Modified files:"
          cat ${{ steps.file_changes.outputs.file_output }} # Display the list of modified files
