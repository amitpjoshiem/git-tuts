name: MS Teams Deploy Card

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      # this is the new step
      - uses: dchourasia/ms-teams-notification@1.0 #  or "./" if in a local set-up
        if: always()
        with:
          github-token: ${{ github.token }}
          webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          show-on-exit: false
          allowed-file-len: 10
          timezone: IN
          custom-facts: |
            - name: Source Branch
              value: ${{ github.event.pull_request.head.ref }}
            - name: Target Branch
              value: ${{ github.event.pull_request.base.ref }}
            - name: Pull Request
              value: ${{ github.event.pull_request.html_url }}
            - name: Reviewers
              value: ${{ github.event.pull_request.requested_reviewers[*].login | join(', ') }}
          custom-actions: |
            - text: View PR
              url: ${{ github.event.pull_request.html_url }}
