name: Sync Branches

on:
  schedule:
    # Runs every 5 minute
    - cron: "0 0 * * 1-5"

  workflow_dispatch: # Allow manual triggering

jobs:
  sync-dev-to-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch latest changes from origin
        run: |
          git fetch origin --prune

      - name: Checkout stage branch and merge dev into it
        run: |
          git checkout stage
          git pull origin stage --ff-only || true
          git merge --no-ff dev || true

      - name: Push changes to origin/stage branch
        run: |
          git push origin stage --force-with-lease || echo "No changes to push"

  sync-stage-to-prod:
    runs-on: ubuntu-latest
    needs: sync-dev-to-stage
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create PR from stage to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base prod --head stage --title "Sync stage to prod" --body "Automated PR to sync stage branch to prod branch"

      - name: Auto-Merge PR stage -> prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --base prod --head stage --state open --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --squash --delete-branch --admin
          fi
