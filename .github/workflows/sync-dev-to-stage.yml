name: Sync Dev to Stage

on:
  push:
    branches:
      - dev

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history for merging

      - name: Set up Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Fetch all branches
        run: |
          git fetch origin

      - name: Checkout stage branch and merge dev into it
        run: |
          git checkout stage || git checkout -b stage
          git pull origin stage --ff-only || true
          git merge --no-ff origin/dev -m "Auto-sync dev into stage [skip ci]" || echo "No changes to merge"

      - name: Push changes to origin/stage branch
        run: |
          git push origin stage || echo "No changes to push"
