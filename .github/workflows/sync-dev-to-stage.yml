name: Sync Dev to Stage

on:
  push:
    branches:
      - dev

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Sync Branches
        uses: tretuna/sync-branches@1.4.0
        with:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          FROM_BRANCH: 'dev'
          TO_BRANCH: 'stage'
