workflows:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**/*'
scripts:
  - changed-files:
      - any-glob-to-any-file: 'scripts/**/*'

# Add 'ENV' label if .env.example file gets modified
ENV:
  - changed-files:
      - any-glob-to-any-file: '.env.example'

# Add 'Package' label if Package.json file gets modified
Package:
  - 'package.json'

# Add 'Config' label to any change to src files within the source dir EXCEPT for the docs sub-folder
Config:
  - 'src/config/*'
# Package:
#   - changed-files:
#       - any-glob-to-any-file: '.package.json'
# # Add 'Config' label to any change to src files within the source dir EXCEPT for the docs sub-folder
# Config:
#   - changed-files:
#       - any-glob-to-any-file: 'src/config/*'

# Add 'root' label to any root file changes
root:
  - changed-files:
      - any-glob-to-any-file: '*'

# Add 'Documentation' label to any changes within 'routes' folder or any subfolders or in any .md file
Documentation:
  - changed-files:
      - any-glob-to-any-file: ['routes/**', '**/*.md']

# Add 'DB' label to any changes within 'src/packages/db/' folder.
DB:
  - changed-files:
      - any-glob-to-any-file: ['src/packages/db/*']